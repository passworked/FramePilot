[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "framepilot-vr"
version = "0.7.0"
description = "Frame-budget-driven adaptive resolution controller and SteamVR OSD."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openvr==2.12.1401",
    "psutil==7.2.2",
    "PySide6==6.9.2",
]

[project.optional-dependencies]
build = ["pyinstaller==6.21.0"]

[project.gui-scripts]
framepilot-vr = "steamvr_adaptive_gui:main"

[project.scripts]
framepilot-vr-cli = "steamvr_adaptive_poc:main"

[tool.setuptools]
py-modules = [
    "steamvr_adaptive_gui",
    "steamvr_adaptive_poc",
    "steamvr_core",
    "steamvr_overlay",
    "vrc_context",
]
